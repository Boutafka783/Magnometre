name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Keystore and Print Base64
        run: |
          ALIAS="gradiometer"
          PASS="GradiometerPass123!"
          FILENAME="gradiometer.jks"
          
          # إنشاء ملف التوقيع
          keytool -genkey -v -keystore $FILENAME -alias $ALIAS -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Gradiometer, OU=Dev, O=MyCompany, L=City, S=State, C=US"
          
          # تحويله إلى Base64
          base64 -w 0 $FILENAME > keystore_base64.txt
          
          echo "=========================================================="
          echo "✅ انسخ النص الطويل الموجود بالأسفل وضعه في سر KEYSTORE_BASE64"
          echo "=========================================================="
          cat keystore_base64.txt
          echo ""
          echo "=========================================================="
          echo "🔑 استخدم هذه البيانات لبقية الأسرار:"
          echo "KEY_ALIAS: $ALIAS"
          echo "KEYSTORE_PASSWORD: $PASS"
          echo "KEY_PASSWORD: $PASS"
          echo "=========================================================="
