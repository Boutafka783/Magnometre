name: Gradiometer Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradiometer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Generate, Validate, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate project files
        run: python setup.py .

      - name: Fix Kotlin Compilation Errors
        run: |
          python -c "
          import os
          pkg_dir = 'app/src/main/java/io/mycompany/gradiometer'

          billing_path = os.path.join(pkg_dir, 'billing/PlayBillingManager.kt')
          if os.path.exists(billing_path):
              with open(billing_path, 'r', encoding='utf-8') as f: content = f.read()
              content = content.replace('details.productDetailsList.firstOrNull()', 'details.firstOrNull()')
              with open(billing_path, 'w', encoding='utf-8') as f: f.write(content)
              print('✅ Fixed PlayBillingManager.kt')

          lang_path = os.path.join(pkg_dir, 'i18n/LanguageScreen.kt')
          if os.path.exists(lang_path):
              with open(lang_path, 'r', encoding='utf-8') as f: content = f.read()
              if 'import io.mycompany.gradiometer.R' not in content:
                  content = content.replace('import io.mycompany.gradiometer.community.AccountDeletion', 'import io.mycompany.gradiometer.R\nimport io.mycompany.gradiometer.community.AccountDeletion')
              with open(lang_path, 'w', encoding='utf-8') as f: f.write(content)
              print('✅ Fixed LanguageScreen.kt')
          "

      - name: Inject Custom App Icon
        run: |
          python -c "
          import os
          from PIL import Image
          import re
          icon_file = None
          for f in os.listdir('.'):
              if f.lower().endswith(('.jpg', '.jpeg', '.png')):
                  icon_file = f
                  break
          if icon_file:
              img = Image.open(icon_file).convert('RGBA')
              sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
              for density, size in sizes.items():
                  folder = f'app/src/main/res/mipmap-{density}'
                  os.makedirs(folder, exist_ok=True)
                  resized = img.resize((size, size), Image.LANCZOS)
                  resized.save(f'{folder}/ic_launcher.png', 'PNG')
                  resized.save(f'{folder}/ic_launcher_round.png', 'PNG')
          "

      - name: Configure Firebase (Raw JSON)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          mkdir -p app
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            python -m json.tool app/google-services.json > /dev/null
          else
            echo "Missing GOOGLE_SERVICES_JSON secret!" >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

  release-bundle:
    name: Build signed release AAB + APK
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate project files
        run: python setup.py .

      - name: Fix Kotlin Compilation Errors
        run: |
          python -c "
          import os
          pkg_dir = 'app/src/main/java/io/mycompany/gradiometer'
          billing_path = os.path.join(pkg_dir, 'billing/PlayBillingManager.kt')
          if os.path.exists(billing_path):
              with open(billing_path, 'r', encoding='utf-8') as f: content = f.read()
              content = content.replace('details.productDetailsList.firstOrNull()', 'details.firstOrNull()')
              with open(billing_path, 'w', encoding='utf-8') as f: f.write(content)
          lang_path = os.path.join(pkg_dir, 'i18n/LanguageScreen.kt')
          if os.path.exists(lang_path):
              with open(lang_path, 'r', encoding='utf-8') as f: content = f.read()
              if 'import io.mycompany.gradiometer.R' not in content:
                  content = content.replace('import io.mycompany.gradiometer.community.AccountDeletion', 'import io.mycompany.gradiometer.R\nimport io.mycompany.gradiometer.community.AccountDeletion')
              with open(lang_path, 'w', encoding='utf-8') as f: f.write(content)
          "

      - name: Inject Custom App Icon
        run: |
          python -c "
          import os
          from PIL import Image
          icon_file = None
          for f in os.listdir('.'):
              if f.lower().endswith(('.jpg', '.jpeg', '.png')):
                  icon_file = f
                  break
          if icon_file:
              img = Image.open(icon_file).convert('RGBA')
              sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
              for density, size in sizes.items():
                  folder = f'app/src/main/res/mipmap-{density}'
                  os.makedirs(folder, exist_ok=True)
                  resized = img.resize((size, size), Image.LANCZOS)
                  resized.save(f'{folder}/ic_launcher.png', 'PNG')
                  resized.save(f'{folder}/ic_launcher_round.png', 'PNG')
          "

      - name: Configure Firebase (Raw JSON)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python -m json.tool app/google-services.json > /dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 🚨 هذه هي الخطوة السحرية: توليد المفتاح تلقائياً إذا لم يكن موجوداً 🚨
      - name: Setup Keystore (Use existing or Generate new)
        id: keystore
        shell: bash
        run: |
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "✅ Using existing KEYSTORE_BASE64 from secrets."
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/gradiometer-release.jks"
            echo "is_generated=false" >> $GITHUB_OUTPUT
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "⚠️ KEYSTORE_BASE64 not found. Generating a new Keystore automatically..."
            keytool -genkey -v -keystore "$RUNNER_TEMP/gradiometer-release.jks" -alias gradiometer -keyalg RSA -keysize 2048 -validity 10000 -storepass "GradiometerPass123!" -keypass "GradiometerPass123!" -dname "CN=Gradiometer, OU=Dev, O=MyCompany, L=City, S=State, C=US"
            echo "is_generated=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_PASSWORD=GradiometerPass123!" >> $GITHUB_ENV
            echo "KEY_ALIAS=gradiometer" >> $GITHUB_ENV
            echo "KEY_PASSWORD=GradiometerPass123!" >> $GITHUB_ENV
            
            mkdir -p generated-keystore
            cp "$RUNNER_TEMP/gradiometer-release.jks" generated-keystore/
            base64 -w 0 "$RUNNER_TEMP/gradiometer-release.jks" > generated-keystore/keystore_base64.txt
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/gradiometer-release.jks" >> $GITHUB_ENV

      - name: Upload Generated Keystore (If newly created)
        if: steps.keystore.outputs.is_generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-keystore-save-this
          path: generated-keystore/

      - name: Build signed Android App Bundle and APK
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: gradiometer-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gradiometer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error