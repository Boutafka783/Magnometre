name: Build Release APK + AAB

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate project from setup.py
        run: python3 setup.py .

      - name: Fix String Formatting Errors
        run: python3 fix_strings_format.py

      - name: Setup App Icon
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          from PIL import Image, ImageDraw
          files = sorted(glob.glob("IMG_*.jpg") + glob.glob("IMG_*.jpeg") + glob.glob("IMG_*.png"))
          if not files:
              print("لا توجد صورة أيقونة (IMG_*)؛ تبقى الأيقونة المؤقتة.")
          else:
              src = Image.open(files[0]).convert("RGB")
              side = min(src.size)
              left = (src.width - side) // 2
              top = (src.height - side) // 2
              src = src.crop((left, top, left + side, top + side))
              sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
              for density, px in sizes.items():
                  folder = "app/src/main/res/mipmap-" + density
                  img = src.resize((px, px), Image.Resampling.LANCZOS)
                  img.save(folder + "/ic_launcher.png")
                  mask = Image.new("L", (px, px), 0)
                  ImageDraw.Draw(mask).ellipse((0, 0, px - 1, px - 1), fill=255)
                  round_img = Image.new("RGBA", (px, px), (0, 0, 0, 0))
                  round_img.paste(img, (0, 0), mask)
                  round_img.save(folder + "/ic_launcher_round.png")
              print("تم تحويل", files[0], "إلى أيقونات التطبيق")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Create google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "الخطأ: السر GOOGLE_SERVICES_JSON غير موجود."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Apply Security Hardening Patch
        shell: bash
        run: |
          if [ -f "gradiometer_security_patch.py" ]; then
            python3 gradiometer_security_patch.py
          else
            echo "⚠️ تحذير: ملف gradiometer_security_patch.py غير موجود. تم تخطي التأمين."
          fi

      - name: Decode Keystore
        shell: bash
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # ✅ بناء النسختين معاً: APK و AAB
      - name: Build Release APK + AAB
        shell: bash
        env:
          KEYSTORE_FILE: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        shell: bash
        run: |
          echo "=== Kotlin errors (file:line) ==="
          grep -n "^e: " build.log | head -40 || true
          echo "=== What went wrong ==="
          grep -n -A15 "What went wrong" build.log | head -40 || true

      # ✅ رفع الملفين (APK & AAB)
      - name: Upload Artifacts (APK & AAB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradiometer-release-files
          path: |
            build.log
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab