name: Gradiometer Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradiometer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Generate, Validate, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate project files
        run: python setup.py .

      # 🚨 الإصلاح الجديد: تصحيح أخطاء Kotlin في الملفات المولدة 🚨
      - name: Fix Kotlin Compilation Errors
        run: |
          python -c "
          import os
          pkg_dir = 'app/src/main/java/io/mycompany/gradiometer'

          # 1. إصلاح PlayBillingManager.kt
          billing_path = os.path.join(pkg_dir, 'billing/PlayBillingManager.kt')
          if os.path.exists(billing_path):
              with open(billing_path, 'r', encoding='utf-8') as f: content = f.read()
              content = content.replace('details.productDetailsList.firstOrNull()', 'details.firstOrNull()')
              with open(billing_path, 'w', encoding='utf-8') as f: f.write(content)
              print('✅ Fixed PlayBillingManager.kt')

          # 2. إصلاح LanguageScreen.kt (إضافة استيراد R)
          lang_path = os.path.join(pkg_dir, 'i18n/LanguageScreen.kt')
          if os.path.exists(lang_path):
              with open(lang_path, 'r', encoding='utf-8') as f: content = f.read()
              if 'import io.mycompany.gradiometer.R' not in content:
                  content = content.replace('import io.mycompany.gradiometer.community.AccountDeletion', 'import io.mycompany.gradiometer.R\nimport io.mycompany.gradiometer.community.AccountDeletion')
              with open(lang_path, 'w', encoding='utf-8') as f: f.write(content)
              print('✅ Fixed LanguageScreen.kt')
          "

      - name: Inject Custom App Icon
        run: |
          python -c "
          import os
          from PIL import Image
          import re

          icon_file = None
          for f in os.listdir('.'):
              if f.lower().endswith(('.jpg', '.jpeg', '.png')):
                  icon_file = f
                  break
                  
          if icon_file:
              print(f'✅ Found custom icon: {icon_file}')
              img = Image.open(icon_file).convert('RGBA')
              sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
              for density, size in sizes.items():
                  folder = f'app/src/main/res/mipmap-{density}'
                  os.makedirs(folder, exist_ok=True)
                  resized = img.resize((size, size), Image.LANCZOS)
                  resized.save(f'{folder}/ic_launcher.png', 'PNG')
                  resized.save(f'{folder}/ic_launcher_round.png', 'PNG')
              print('✅ Custom icons generated.')
          else:
              print('No custom icon found, using default generated icon.')
          "

      - name: Configure Firebase (Raw JSON)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          mkdir -p app
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            python -m json.tool app/google-services.json > /dev/null
          else
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "gradiometer-ci-placeholder",
              "storage_bucket": "gradiometer-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                "android_client_info": { "package_name": "io.mycompany.gradiometer" }
              },
              "api_key": [{ "current_key": "CI_ONLY_NOT_A_REAL_KEY" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }]
          }
          JSON
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

  release-bundle:
    name: Build signed release AAB + APK
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow

      - name: Generate project files
        run: python setup.py .

      # 🚨 الإصلاح الجديد: تصحيح أخطاء Kotlin في الملفات المولدة 🚨
      - name: Fix Kotlin Compilation Errors
        run: |
          python -c "
          import os
          pkg_dir = 'app/src/main/java/io/mycompany/gradiometer'

          # 1. إصلاح PlayBillingManager.kt
          billing_path = os.path.join(pkg_dir, 'billing/PlayBillingManager.kt')
          if os.path.exists(billing_path):
              with open(billing_path, 'r', encoding='utf-8') as f: content = f.read()
              content = content.replace('details.productDetailsList.firstOrNull()', 'details.firstOrNull()')
              with open(billing_path, 'w', encoding='utf-8') as f: f.write(content)
              print('✅ Fixed PlayBillingManager.kt')

          # 2. إصلاح LanguageScreen.kt (إضافة استيراد R)
          lang_path = os.path.join(pkg_dir, 'i18n/LanguageScreen.kt')
          if os.path.exists(lang_path):
              with open(lang_path, 'r', encoding='utf-8') as f: content = f.read()
              if 'import io.mycompany.gradiometer.R' not in content:
                  content = content.replace('import io.mycompany.gradiometer.community.AccountDeletion', 'import io.mycompany.gradiometer.R\nimport io.mycompany.gradiometer.community.AccountDeletion')
              with open(lang_path, 'w', encoding='utf-8') as f: f.write(content)
              print('✅ Fixed LanguageScreen.kt')
          "

      - name: Inject Custom App Icon
        run: |
          python -c "
          import os
          from PIL import Image
          import re

          icon_file = None
          for f in os.listdir('.'):
              if f.lower().endswith(('.jpg', '.jpeg', '.png')):
                  icon_file = f
                  break
                  
          if icon_file:
              img = Image.open(icon_file).convert('RGBA')
              sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
              for density, size in sizes.items():
                  folder = f'app/src/main/res/mipmap-{density}'
                  os.makedirs(folder, exist_ok=True)
                  resized = img.resize((size, size), Image.LANCZOS)
                  resized.save(f'{folder}/ic_launcher.png', 'PNG')
                  resized.save(f'{folder}/ic_launcher_round.png', 'PNG')
          "

      - name: Check required release secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          for name in GOOGLE_SERVICES_JSON KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure Firebase (Raw JSON)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python -m json.tool app/google-services.json > /dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gradiometer-release.jks"
          test -s "$RUNNER_TEMP/gradiometer-release.jks"

      - name: Build signed Android App Bundle and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/gradiometer-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: gradiometer-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: gradiometer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14